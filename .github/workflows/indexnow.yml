# After each successful production deployment on Vercel, tell IndexNow (Bing,
# Copilot, Yandex...) which pages changed. See scripts/indexnow.mjs.
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
